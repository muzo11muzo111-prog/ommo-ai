<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ommo AI - دردشة ذكية</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background-color: #121212; color: #eee; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        header { background-color: #1f1f1f; padding: 0.8rem; text-align: center; border-bottom: 1px solid #333; }
        h1 { margin: 0; font-size: 1.3rem; color: #ff9800; }
        #chat-container { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; padding: 12px; border-radius: 12px; line-height: 1.5; word-wrap: break-word; font-size: 0.95rem; }
        .user-message { align-self: flex-end; background-color: #ff9800; color: #121212; border-bottom-right-radius: 2px; }
        .ai-message { align-self: flex-start; background-color: #2d2d2d; color: #eee; border-bottom-left-radius: 2px; }
        .error-message { align-self: center; background-color: #d32f2f; color: white; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; }
        #input-area { background-color: #1f1f1f; padding: 0.8rem; display: flex; gap: 8px; border-top: 1px solid #333; }
        input[type="text"] { flex: 1; padding: 12px; border: none; border-radius: 8px; background-color: #2d2d2d; color: #eee; font-size: 1rem; }
        input[type="text"]:focus { outline: 2px solid #ff9800; }
        button { padding: 0 16px; border: none; border-radius: 8px; background-color: #ff9800; color: #121212; font-weight: bold; cursor: pointer; font-size: 1rem; }
        button:hover { background-color: #f57c00; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #api-key-section { background-color: #181818; padding: 0.5rem 1rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #333; font-size: 0.8rem; color: #aaa; }
        #api-key-input { background: #2d2d2d; border: 1px solid #444; color: #fff; padding: 4px 8px; border-radius: 4px; width: 60%; }
    </style>
</head>
<body>

<header>
    <h1>Ommo AI</h1>
</header>

<div id="api-key-section">
    <span>مفتاح API:</span>
    <input type="password" id="api-key-input" placeholder="أدخل مفتاح Gemini هنا">
</div>

<div id="chat-container">
    <div class="message ai-message">أهلاً بك! أنا Ommo، كيف يمكنني مساعدتك اليوم؟</div>
</div>

<div id="input-area">
    <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." autocomplete="off">
    <button id="send-btn">إرسال</button>
</div>

<script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const apiKeyInput = document.getElementById('api-key-input');

    // Load API key from localStorage
    if (localStorage.getItem('gemini_api_key')) {
        apiKeyInput.value = localStorage.getItem('gemini_api_key');
    }

    // Save API key to localStorage when changed
    apiKeyInput.addEventListener('input', () => {
        localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
    });

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    function appendMessage(sender, text) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', sender === 'user' ? 'user-message' : 'ai-message');
        messageDiv.textContent = text;
        chatContainer.appendChild(messageDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function appendError(text) {
        const errorDiv = document.createElement('div');
        errorDiv.classList.add('error-message');
        errorDiv.textContent = text;
        chatContainer.appendChild(errorDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        const apiKey = apiKeyInput.value.trim();

        if (!text) return;
        if (!apiKey) {
            appendError('الرجاء إدخال مفتاح Gemini API في الأعلى أولاً.');
            return;
        }

        userInput.value = '';
        appendMessage('user', text);
        sendBtn.disabled = true;
        sendBtn.textContent = '...';

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: text }] }]
                })
            });

            const data = await response.json();

            if (response.ok && data.candidates && data.candidates[0].content.parts[0].text) {
                const aiResponse = data.candidates[0].content.parts[0].text;
                appendMessage('ai', aiResponse);
            } else {
                let errorMsg = 'حدث خطأ في استجابة الخادم.';
                if (data.error && data.error.message) {
                    errorMsg = `خطأ: ${data.error.message}`;
                }
                appendError(errorMsg);
            }

        } catch (error) {
            appendError('تعذر الاتصال بالخادم، تحقق من الاتصال بالإنترنت.');
        } finally {
            sendBtn.disabled = false;
            sendBtn.textContent = 'إرسال';
            userInput.focus();
        }
    }
</script>

</body>
</html>
