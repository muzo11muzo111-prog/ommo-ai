<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ommo AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-white h-screen flex flex-col justify-between overflow-hidden">

    <!-- شريط العرض العلوي -->
    <header class="flex items-center justify-between px-4 py-3 bg-[#1e1e1e] border-b border-neutral-800 shrink-0">
        <button class="text-neutral-400 hover:text-white text-xl">&#9776;</button>
        
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-[#f97316] flex items-center justify-center font-bold text-white shadow-md">&#9712;</div>
            <span class="font-bold text-lg tracking-wider">ommo</span>
        </div>

        <button onclick="toggleIncognito()" id="incognitoBtn" class="text-neutral-400 hover:text-[#f97316] transition text-sm px-3 py-1 border border-neutral-700 rounded-lg">
            مخفي 🕶️
        </button>
    </header>

    <!-- صندوق المحادثة والرسائل -->
    <main id="chatHistory" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-2xl w-full mx-auto">
        <div class="flex justify-start">
            <div class="bg-[#1e1e1e] border border-neutral-800 p-3 rounded-2xl max-w-[80%] text-sm text-neutral-200">
                أهلاً بك، أنا Ommo صممني المبدع محمد طراف. كيف يمكنني مساعدتك اليوم؟
            </div>
        </div>
    </main>

    <!-- شريط الإدخال السفلي -->
    <footer class="p-4 bg-[#121212] border-t border-neutral-800 shrink-0">
        <div class="max-w-2xl mx-auto flex items-center gap-2 bg-[#1e1e1e] border border-neutral-700 rounded-full px-4 py-2 shadow-lg">
            
            <!-- حقل الكتابة -->
            <input type="text" id="chatInput" placeholder="اكتب رسالتك هنا..." class="flex-1 bg-transparent border-none focus:outline-none text-sm text-white placeholder-neutral-500 px-2">

            <!-- زر الإرسال البرتقالي -->
            <button type="button" onclick="sendMessage()" class="bg-[#f97316] hover:bg-orange-600 text-white p-2.5 rounded-full transition flex items-center justify-center cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>
        </div>
    </footer>

    <script>
        let sessionId = "user_" + Math.random().toString(36).substring(2);
        let isIncognito = false;

        function toggleIncognito() {
            isIncognito = !isIncognito;
            const btn = document.getElementById('incognitoBtn');
            if (isIncognito) {
                btn.style.borderColor = "#f97316";
                btn.style.color = "#f97316";
                sessionId = "incognito_" + Math.random().toString(36).substring(2);
                alert("تم تفعيل التصفح المخفي!");
            } else {
                btn.style.borderColor = "";
                btn.style.color = "";
                sessionId = "user_" + Math.random().toString(36).substring(2);
                alert("تم إيقاف التصفح المخفي.");
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const history = document.getElementById('chatHistory');
            const msg = input.value.trim();
            
            if (!msg) return;

            // 1. عرض رسالة المستخدم فوراً باليمين
            history.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-[#f97316] text-white p-3 rounded-2xl max-w-[80%] text-sm shadow-md">
                        ${msg}
                    </div>
                </div>
            `;
            input.value = '';
            history.scrollTop = history.scrollHeight;

            try {
                // 2. إرسال الطلب للسيرفر
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, message: msg })
                });
                const data = await res.json();

                // 3. عرض رد Ommo باليسار
                history.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-[#1e1e1e] border border-neutral-800 p-3 rounded-2xl max-w-[80%] text-sm text-neutral-200 shadow-md">
                            ${data.reply}
                        </div>
                    </div>
                `;
                history.scrollTop = history.scrollHeight;
            } catch (err) {
                // رد احتياطي في حال بطء الاتصال
                history.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-[#1e1e1e] border border-neutral-800 p-3 rounded-2xl max-w-[80%] text-sm text-neutral-200">
                            أهلاً بك، أنا Ommo صممني محمد طراف وجاهز لمتابعة الدردشة معك!
                        </div>
                    </div>
                `;
                history.scrollTop = history.scrollHeight;
            }
        }

        // دعم زر Enter للإرسال المباشر
        document.getElementById('chatInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
