<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ommo AI - المساعد الذكي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f0f0f; color: #f1f1f1; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #1a1a1a; padding: 15px; text-align: center; border-bottom: 1px solid #2a2a2a; }
        h1 { font-size: 1.2rem; color: #ff9800; font-weight: 700; }
        
        #settings-bar { background-color: #141414; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a2a2a; font-size: 0.85rem; color: #888; }
        #api-key-input { background: #222; border: 1px solid #333; color: #fff; padding: 6px 10px; border-radius: 6px; width: 65%; font-size: 0.85rem; }
        #api-key-input:focus { outline: 1px solid #ff9800; }

        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 14px; line-height: 1.6; font-size: 0.95rem; word-break: break-word; }
        .user-message { align-self: flex-end; background-color: #ff9800; color: #000; border-bottom-right-radius: 3px; font-weight: 500; }
        .ai-message { align-self: flex-start; background-color: #212121; color: #f1f1f1; border-bottom-left-radius: 3px; border: 1px solid #2c2c2c; }
        .error-message { align-self: center; background-color: #ffebee; color: #c62828; padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; border: 1px solid #ef9a9a; }

        #input-area { background-color: #1a1a1a; padding: 12px 15px; display: flex; gap: 10px; border-top: 1px solid #2a2a2a; }
        #user-input { flex: 1; padding: 12px; border: 1px solid #333; border-radius: 8px; background-color: #222; color: #fff; font-size: 0.95rem; }
        #user-input:focus { outline: 1px solid #ff9800; }
        #send-btn { padding: 0 20px; border: none; border-radius: 8px; background-color: #ff9800; color: #000; font-weight: bold; cursor: pointer; font-size: 0.95rem; transition: background 0.2s; }
        #send-btn:hover { background-color: #f57c00; }
        #send-btn:disabled { background-color: #444; color: #777; cursor: not-allowed; }
    </style>
</head>
<body>

<header>
    <h1>Ommo AI</h1>
</header>

<div id="settings-bar">
    <span>مفتاح Gemini API:</span>
    <input type="password" id="api-key-input" placeholder="الصق المفتاح هنا (محفوظ محلياً)">
</div>

<div id="chat-container">
    <div class="message ai-message">أهلاً بك يا محمد! أنا Ommo، جاهز لمساعدتك ومتابعة أفكارك البرمجية والعلمية. كيف أخدمك اليوم؟</div>
</div>

<div id="input-area">
    <input type="text" id="user-input" placeholder="اكتب رسالتك أو سؤالك هنا..." autocomplete="off">
    <button id="send-btn">إرسال</button>
</div>

<script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const apiKeyInput = document.getElementById('api-key-input');

    // استعادة المفتاح المخزن مسبقاً في المتصفح إن وجد
    if (localStorage.getItem('ommo_gemini_key')) {
        apiKeyInput.value = localStorage.getItem('ommo_gemini_key');
    }

    // حفظ المفتاح تلقائياً عند إدخاله
    apiKeyInput.addEventListener('input', () => {
        localStorage.setItem('ommo_gemini_key', apiKeyInput.value.trim());
    });

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    function appendMessage(sender, text) {
        const div = document.createElement('div');
        div.classList.add('message', sender === 'user' ? 'user-message' : 'ai-message');
        div.textContent = text;
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function appendError(text) {
        const div = document.createElement('div');
        div.classList.add('error-message');
        div.textContent = text;
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        const apiKey = apiKeyInput.value.trim();

        if (!text) return;
        if (!apiKey) {
            appendError('الرجاء إدخال مفتاح Gemini API في الشريط العلوي أولاً.');
            return;
        }

        userInput.value = '';
        appendMessage('user', text);
        sendBtn.disabled = true;
        sendBtn.textContent = '...';

        // رابط الاتصال المحدث والرسمي لنموذج فلاش المستقر
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

        try {
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: text }] }]
                })
            });

            const data = await response.json();

            if (response.ok && data.candidates && data.candidates[0].content.parts[0].text) {
                const reply = data.candidates[0].content.parts[0].text;
                appendMessage('ai', reply);
            } else {
                let errDesc = 'خطأ غير معروف من خادم Google.';
                if (data.error && data.error.message) {
                    errDesc = data.error.message;
                }
                appendError(`فشل الاتصال: ${errDesc}`);
            }
        } catch (err) {
            appendError('تعذر الاتصال بالشبكة، تحقق من اتصال الإنترنت.');
        } finally {
            sendBtn.disabled = false;
            sendBtn.textContent = 'إرسال';
            userInput.focus();
        }
    }
</script>

</body>
</html>
